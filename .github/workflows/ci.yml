name: CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: git_for_prompts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @gfp/core
        run: pnpm --filter @gfp/core build

      - name: Sync database schema
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/git_for_prompts_test
        run: npx drizzle-kit push

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/git_for_prompts_test
        run: pnpm test
